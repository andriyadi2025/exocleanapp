  <!-- ==========================================================================
       mitra.html — pintu masuk aplikasi MITRA LAPANGAN
       --------------------------------------------------------------------------
       SATU BASIS KODE, DUA PINTU MASUK

       Berkas ini memuat modul yang SAMA dengan index.html, hanya lebih sedikit.
       Aturan bisnisnya — siklus pesanan, harga, checklist, tip, bagi hasil —
       tidak disalin ke mana pun. Dua salinan aturan yang sama akan menyimpang,
       dan yang ketahuan belakangan adalah klien dan mitra melihat angka berbeda
       untuk pekerjaan yang sama.

       YANG SENGAJA TIDAK DIMUAT

       Seluruh layar toko, marketplace, pembayaran gateway, CRM, admin, dan
       klien. Mitra lapangan tidak pernah membukanya, dan membawanya berarti
       memaksa perangkat kelas bawah di lapangan mengunduh ratusan kilobyte
       yang tidak akan pernah ia pakai.

       Modul LOGIKA tetap ikut meski sebagian miliknya toko: berkasnya kecil,
       saling terkait erat dengan inti, dan membuangnya menuntut belasan
       penjaga di kode bersama — biaya yang lebih besar daripada manfaatnya.
       ========================================================================== -->

  <div id="modal-root"></div>
  <div id="toast-root"></div>
