# ============================================================================
#  nginx — reverse proxy untuk EXOCLEAN (aplikasi statis + 3 server pendamping)
#  ----------------------------------------------------------------------------
#  Salin ke /etc/nginx/sites-available/exoclean, ganti DOMAIN, lalu:
#     sudo ln -s /etc/nginx/sites-available/exoclean /etc/nginx/sites-enabled/
#     sudo certbot --nginx -d app.exoclean.id      # sertifikat Let's Encrypt
#     sudo nginx -t && sudo systemctl reload nginx
#
#  Prinsip:
#   · Hanya 443 yang terbuka ke internet; 80 hanya mengalihkan ke HTTPS.
#   · Server Node mendengar di 127.0.0.1 saja (tls.js) — dunia luar hanya
#     bisa masuk lewat nginx ini. Set TRUST_PROXY=1 di app/server/.env.
#   · Konsol admin (exo-admin.html, exo-analisa.html) dibatasi IP + Basic Auth
#     di sini, DI ATAS gerbang login di dalam halamannya.
#   · Webhook gateway (Midtrans/Xendit) tidak dibatasi laju ketat, tetapi
#     signature/callback token tetap diverifikasi di server Node.
# ============================================================================

limit_req_zone $binary_remote_addr zone=exo_api:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=exo_auth:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=exo_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name app.exoclean.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.exoclean.id;

    # --- TLS (certbot mengisi dua baris pertama) ---
    ssl_certificate     /etc/letsencrypt/live/app.exoclean.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.exoclean.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:exo_ssl:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- header pengaman untuk aplikasi statis ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
    # CSP juga ada di <meta> tiap halaman; header ini berlaku untuk semua berkas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://connect.facebook.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://accounts.google.com https://challenges.cloudflare.com https://www.facebook.com https://app.midtrans.com https://app.sandbox.midtrans.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    server_tokens off;
    client_max_body_size 2m;
    limit_conn exo_conn 40;

    # --- aplikasi statis (folder app/) ---
    root /var/www/exoclean/app;
    index exo.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # service worker & manifest tidak boleh disinggahkan lama
    location ~ ^/(sw\.js|manifest-exo\.json)$ { add_header Cache-Control "no-cache"; }
    # aset berversi boleh lama
    location ~* \.(png|jpg|jpeg|webp|svg|woff2?)$ { expires 30d; add_header Cache-Control "public"; }

    # --- konsol admin: allowlist IP kantor/VPN + Basic Auth ---
    #     sudo htpasswd -c /etc/nginx/.htpasswd-exoclean admin
    location ~ ^/(exo-admin\.html|exo-analisa\.html|js/exo-admin.*\.js|data/contoh/.*)$ {
        allow 203.0.113.0/24;      # ganti: IP kantor
        allow 10.8.0.0/24;         # ganti: jaringan VPN
        deny  all;
        auth_basic           "EXOCLEAN admin";
        auth_basic_user_file /etc/nginx/.htpasswd-exoclean;
        try_files $uri =404;
    }

    # --- berkas yang tidak boleh terlayani sama sekali ---
    location ~ /\.(env|git|ht) { deny all; return 404; }
    location ^~ /server/       { deny all; return 404; }
    location ^~ /backup        { deny all; return 404; }

    # --- server pendamping (Node, 127.0.0.1) ---
    location /api/pay/ {
        limit_req zone=exo_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/exoclean-proxy.inc;
    }
    location /api/auth/ {
        limit_req zone=exo_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/exoclean-proxy.inc;
    }
    location /api/posisi/ {
        limit_req zone=exo_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4200;
        include /etc/nginx/exoclean-proxy.inc;
    }
}

