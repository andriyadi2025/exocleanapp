  .doc { max-width:1420px; margin:0 auto; padding:48px 56px 64px; display:flex; flex-direction:column; gap:28px; }

  .lv { display:inline-flex; align-items:center; font-size:11px; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .ada { background:var(--color-accent-500); color:var(--color-bg); font-weight:700; }
  .sebagian { box-shadow:inset 0 0 0 1.5px var(--color-accent-400); color:var(--color-accent-800); font-weight:600; }
  .tidak { background:var(--color-neutral-200); color:color-mix(in srgb, var(--color-text) 60%, transparent); }
