  <!-- ==========================================================================
       exo-admin.html — konsol backend EXOCLEAN App (14 modul)
       --------------------------------------------------------------------------
       Wujud kode dari "EXOCLEAN Admin.dc.html": dash · live · orders · cleaners
       · services · crm · sop · desk · claims · promos · rewards · brand ·
       roles · team. Konsol ini mengatur MARKETPLACE (exo.html); manajemen
       operasi korporat tetap di index.html.

       Yang tersambung sungguhan ke exo.html lewat localStorage asal yang sama:
         · Appearance  → logo, warna, nama, running text (js/exo-brand.js)
         · Services    → layanan dijeda hilang dari katalog & beranda
         · Promos      → nominal & status CLEAN25 divalidasi di keranjang
       Sisanya data contoh dari rancangan, siap diganti API.
       ========================================================================== -->
  <div class="adm">
    <aside class="adm-side" id="adm-side"></aside>
    <div class="adm-main">
      <div class="adm-top" id="adm-top"></div>

    </div>
  </div>
  <div id="adm-lapis"></div>
  <script>
    window.I18N = window.I18N || { t: function (s) { return s; }, untuk: function (k, s) { return s; }, get: function () { return 'en'; } };
